# Paper-method configuration. Paths are relative to this repository.
# The bundled simulation lead field has 63 sensors, not the paper's 64.
root_dir: ..
data:
  manifest: outputs/paper_synthetic/manifest.json
model:
  profile: paper
training:
  output_dir: outputs/paper_training
  seed: 2026
  epochs: 250
  batch_size: 32
  learning_rate: 0.0001
  minimum_learning_rate: 0.0
  warmup_epochs: 20
  cooldown_epochs: 20
  # The paper specifies a 15:1 ratio; absolute scale 1/15 is explicit here.
  lambda_sensor: 1.0
  lambda_source: 15.0
  delta: 0.1
  loss_reduction: paper
  snr_db: -5.0
  noise_mode: sample_energy
synthesis:
  cortex_path: support_data/simulation/Cortex_1024.mat
  leadfield_path: support_data/simulation/Gain_n_1024.mat
  tbf_path: support_data/simulation/TBF.mat
  output_dir: outputs/paper_synthetic
  seed: 2026
  source_count: 1
  area_range_cm2: [0.0, 20.0]
  allow_overlap: false
  temporal_correlation: null
  sensor_snr_db: -5.0
  train_samples: 27000
  validation_samples: 27000
  test_samples: 100
  shard_size: 128
  time_points: 40
  drop_first: true
