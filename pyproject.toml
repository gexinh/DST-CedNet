[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dst-cednet"
version = "0.2.0"
description = "Data-synthesized spatiotemporal convolutional encoder-decoder for electromagnetic source imaging"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.23.5,<2",
  "scipy>=1.10,<1.14",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
train = ["tensorflow>=2.15,<2.16", "h5py>=3.8,<4"]
cpu = ["tensorflow-cpu>=2.15,<2.16", "h5py>=3.8,<4"]
plot = ["matplotlib>=3.7,<4"]
dev = ["build>=1,<2"]

[tool.setuptools.packages.find]
include = ["dst_cednet*"]

[tool.setuptools.package-data]
dst_cednet = ["matlab/*.m"]
